# =============================================================================
# Pose Transfer Configuration v21 (Face Scale Fix + Debug Control)
# =============================================================================

# [1] 모델 설정
model:
  backend: "onnxruntime"
  device: "cuda"
  mode: "performance"
  to_openpose: false

# [2] 다중 인물 필터링
person_filter:
  enabled: true
  area_weight: 0.6
  center_weight: 0.4
  min_keypoints: 5
  confidence_threshold: 0.3

# [3] 손 정밀화 (작은 손 업스케일링)
hand_refinement:
  enabled: true
  min_hand_size: 48
  max_scale_factor: 4.0

# =============================================================================
# [4] 포즈 전이 설정
# =============================================================================
transfer:
  normalization_base: "shoulder_width"
  confidence_threshold: 0.3
  visibility_margin: 0.5
  enable_upper_ratio_tuning: false
  enable_lower_ratio_tuning: false

# =============================================================================
# [5] 교차 필터링 (Cross-Filtering) v4.0
# =============================================================================
# Body 모델의 "존재 유무" + DWPose의 "정밀 좌표" 결합
# 부모-자식 종속 필터링으로 DWPose 환각 제거 + 디테일 보존
#
# 핵심 전략: "몸통이 보증하면, 디테일은 DWPose 것을 쓴다"
#
# 역할 분리:
#   - Body 모델 (감시자): "여기에 팔이 있는가?" (존재 여부만 판단)
#   - DWPose (아티스트): "손가락 마디는 어디에?" (정밀 묘사 담당)
#
# 예시:
#   1. Body 모델이 "왼손목 있음" → DWPose 왼손 21개 전부 승인
#   2. Body 모델이 "무릎 없음" → DWPose 무릎 좌표 무시 (환각 제거)
# =============================================================================
cross_filter:
  enabled: true                    # 교차 필터링 활성화
  
  # Body 모델 신뢰도 임계값 (존재 판단)
  # 이 값보다 높은 신뢰도를 가진 Body 키포인트만 "진짜 존재"로 인정
  # ⚠️ 너무 낮으면 오검출, 너무 높으면 과도한 제거
  body_confidence_threshold: 0.25  # 0.25~0.8 권장 (기본: 0.3, knee 보존용)
  
  # 부모-자식 종속 규칙
  enable_hand_dependency: true     # 손목 없으면 손가락도 없음
  enable_foot_dependency: true     # 발목 없으면 발가락도 없음
  enable_face_dependency: true     # 코/목 없으면 얼굴도 없음
  
  # DWPose 자체 신뢰도 안전 체크
  # Body가 승인해도 DWPose 신뢰도가 너무 낮으면 제외
  dw_min_confidence: 0.05          # 0.05~0.1 권장
  
  # DWPose 고신뢰도 보호 (우회 통과)
  # DWPose confidence가 이 값보다 높으면 Body 검증 없이 무조건 승인
  # Body가 오검출하거나 보지 못한 경우에도 DWPose가 확신하면 보존
  # ⚠️ 너무 낮으면 할루시네이션 위험, 너무 높으면 디테일 손실
  dw_high_confidence_threshold: 8.0  # 7.0~10.0 권장 (기본: 8.0, 비활성화: 999.0)
  
  # DWPose 전신 확신 모드 (Body 검증 완전 우회)
  # DWPose의 Body 17개 키포인트가 모두 이 값 이상이면 Cross-Filter 전체 우회
  # 전신이 명확한 이미지에서 과도한 필터링 방지
  # ⚠️ 너무 낮으면 할루시네이션 위험, 너무 높으면 우회 효과 없음
  dw_full_body_confidence_threshold: 6.0  # 5.0~8.0 권장 (기본: 6.0, 비활성화: 999.0)
  
  # Clean Mode 설정 (의심 키포인트가 없을 때)
  # 133개 키포인트 중 suspicious 범위에 있는 것이 0개면 Clean Mode 활성화
  # Clean Mode에서는 body_confidence_threshold를 완화하여 전신 이미지를 더 잘 통과시킴
  dw_suspicious_threshold: 2.0     # 이 이하는 의심 키포인트로 판단 (0.05~2.0)
  clean_mode_body_threshold: 0.2   # Clean mode일 때 body 임계값 (0.3보다 낮게 완화)
  
  # Hand 할루시네이션 방지
  # Body 모델에는 손목까지만 있고 손가락(91-133)은 없음
  # 손목이 없는데 손가락들이 suspicious 범위에 있으면 할루시네이션으로 판단하여 제거
  hand_hallucination_check: true   # 손목 없으면 의심 범위 손가락도 제거
  hand_dw_min_confidence: 2.0      # 손가락 DWPose 최소 신뢰도 (손가락 전용, 포켓/뒤로 숨은 손 방지)
  
  # Foot 할루시네이션 방지
  # 발목이 있어도 발가락들이 낮은 신뢰도면 할루시네이션일 수 있음
  # 발목 Body confidence가 낮거나 발가락이 낮은 DWPose confidence면 제거
  foot_hallucination_check: true   # 발목 Body 낮으면 발가락도 제거
  foot_body_confidence_threshold: 0.25  # 발목 Body 임계값 (일반과 동일)
  foot_dw_min_confidence: 2.5      # 발가락 DWPose 최소 신뢰도 (발가락 전용, 할루시네이션 방지)

# =============================================================================
# [6] 폴백 전략 (누락된 부위 복구)
# =============================================================================
fallback:
  symmetric_mirror: true
  hierarchical_estimation: true
  fallback_confidence_decay: 0.5

# =============================================================================
# [7] 렌더링 스타일
# =============================================================================
rendering:
  line_thickness: 2
  face_line_thickness: 1
  hand_line_thickness: 2
  point_radius: 1
  background_color: [0, 0, 0]
  kpt_threshold: 0.1
  draw_neck: true  # Neck 키포인트 표시 (어깨 중심점)

# =============================================================================
# [8] 출력 설정
# =============================================================================
# 핵심 결과물 vs 디버그 결과물 분리
#
# 핵심 결과물 (항상 생성 권장):
#   - *_kp.json: 키포인트 좌표 데이터 (후속 처리용)
#   - *_sk.jpg: 스켈레톤 이미지 (ControlNet 입력용)
#
# 디버그 결과물 (개발/분석 시에만):
#   - *_rend.jpg: 원본+스켈레톤 오버레이
#   - *_debug_bbox.jpg: YOLO bbox 시각화
#   - *_debug.txt: Cross-Filter 분석 텍스트
#   - *_depth.png: Depth 시각화
#   - face_transfer_debug.jpg: 얼굴 전이 시각화
# =============================================================================
output:
  # ===== 핵심 결과물 (항상 생성 권장) =====
  save_json: true                   # *_kp.json 저장
  save_skeleton_image: true         # *_sk.jpg 저장
  
  # ===== 디버그 결과물 =====
  debug:
    enabled: true                  # 마스터 스위치 (false면 아래 모두 무시)
    save_overlay: true             # *_rend.jpg (원본+스켈레톤 오버레이)
    save_bbox: true                # *_debug_bbox.jpg (YOLO bbox)
    save_text: true                # *_debug.txt (Cross-Filter 분석)
    save_depth: true               # *_depth.png (Depth 시각화)
    save_face_viz: false            # face_transfer_debug.jpg
  
  # ===== 기타 옵션 =====
  auto_crop_enabled: false
  canvas_padding_ratio: 0
  crop_padding_px: 0
  head_padding_ratio: 0.5

# =============================================================================
# [9] 시스템 설정
# =============================================================================
system:
  retain_inputs: true
  enable_archiving: false

# =============================================================================
# [9.5] Depth Anything V2 (optional)
# =============================================================================
depth_anything:
  enabled: true
  model: "depth_anything_v2_vitl"
  device: "cuda"
  repo_path: "D:/2025/pose_extractor/vendor/Depth-Anything-V2"
  # z_scale: null  # null이면 이미지 긴 변으로 자동 설정

# =============================================================================
# [10] 디버그 설정
# =============================================================================
# 콘솔 로그 출력 제어 - Transfer 및 Extraction 과정의 상세 로그를 개별 제어
#
# 배경:
#   기존에는 모든 디버그 로그가 항상 출력되어 터미널이 매우 길어지는 문제가 있었습니다.
#   이제 각 단계별로 로그를 선택적으로 켜고 끌 수 있습니다.
#
# 사용 시나리오:
#   1. 일반 사용: 모두 false로 설정 → 필수 정보만 출력 (깔끔)
#   2. 디버깅: 문제가 발생한 단계만 true로 설정 → 해당 단계만 상세 분석
#   3. 개발: 모두 true로 설정 → 전체 파이프라인 분석
#
# 권장 설정 (일반 사용):
#   show_cross_filter: true  (필터링 결과만 확인)
#   나머지: false  (상세 로그 비활성화)
#
# 권장 설정 (얼굴 문제 디버깅):
#   show_face_transfer: true  (얼굴 전이 상세 로그)
#   나머지: false
# =============================================================================
debug:
  # ===== Extraction 단계 로그 =====
  # Pose extraction 과정 (DWPose, Cross-Filter 등)
  
  show_dwpose_coords: false        # DWPose 원본 좌표 출력
                                   # true: 각 키포인트의 (x, y, score) 표시
                                   #   예: "[DWPose] idx=9 xy=(3625.7, 3912.3) score=4.234"
                                   # false: 출력 안함
                                   # 💡 권장: false (매우 길어질 수 있음)
  
  show_cross_filter: true          # Cross-Filter 적용 결과
                                   # true: 필터링 결과 요약 표시
                                   #   예: "✅ Cross-Filter 적용: 133/133 keypoints 승인"
                                   # false: 출력 안함
                                   # 💡 권장: true (필터링 결과 확인용)
  
  show_hand_refinement: false      # Hand Refinement 처리 로그
                                   # true: 손 영역 업스케일링 상세 정보
                                   # false: 출력 안함
                                   # 💡 권장: false (일반적으로 불필요)
  
  # ===== Transfer 단계 로그 =====
  # Pose transfer 과정 (Body, Face, Hand 전이)
  
  show_transfer_stages: false      # Transfer 전체 단계 표시
                                   # true: 각 단계 시작 메시지 표시
                                   #   예: "🏃 Body Transfer...", "👤 Face Transfer..."
                                   # false: 출력 안함
                                   # 💡 권장: false (간결한 출력)
  
  show_body_transfer: false        # Body 전이 상세 로그
                                   # true: Chain 전이, Feet 전이 등 상세 정보
                                   #   - transfer_chain(UPPER/LOWER) 상세
                                   #   - 각 뼈 길이 계산 및 적용 과정
                                   #   - Feet transfer 상세 (발 각 부위별)
                                   # false: 출력 안함
                                   # ⚠️ 매우 길어질 수 있음 (50+ 줄)
                                   # 💡 권장: false (Body 문제 디버깅 시만 true)
  
  show_face_transfer: false        # Face 전이 상세 로그
                                   # true: Face Scale, Landmarks 전이 상세 정보
                                   #   - Face Scale 계산 과정
                                   #   - Body Face (코/눈/귀) 배치 상세
                                   #   - Face Landmarks (68개) 전이 상세
                                   # false: 출력 안함
                                   # 💡 권장: false (얼굴 문제 디버깅 시만 true)
  
  show_hand_transfer: false        # Hand 전이 상세 로그
                                   # true: 손 전이 전략, 스케일 계산 등
                                   #   - 각 손가락별 전이 상세
                                   #   - 스케일 계산 과정
                                   # false: 출력 안함
                                   # 💡 권장: false (손 문제 디버깅 시만 true)
  
  # ===== Post-processing 로그 =====
  
  show_alignment: false            # Alignment 상세 로그
                                   # true: Feet/Face 정렬 계산 상세 정보
                                   #   - Feet 정렬: 발 위치, shift_y 계산
                                   #   - Face 정렬: 얼굴 중심, shift_x/y 계산
                                   # false: 출력 안함
                                   # 💡 권장: false (정렬 문제 디버깅 시만 true)
  
  show_canvas: false               # Canvas 확장 로그
                                   # true: Bbox 계산, Padding 추가 등 상세 정보
                                   #   - Valid keypoints bbox
                                   #   - Required canvas bounds
                                   #   - Padding calculation
                                   # false: 출력 안함
                                   # 💡 권장: false (Canvas 문제 디버그 시만 true)
  
  # ===== BBox 시각화 (이미지 렌더링) =====
  # 디버그 이미지에 bbox를 그릴지 여부
  # 콘솔 로그와 무관하게 이미지에만 영향
  
  bbox_visualization: true         # BBox 시각화 활성화
  visualize_keypoint_bbox: true    # Keypoint 기반 bbox 표시
  visualize_yolo_bbox: true        # YOLO 검출 bbox 표시
  visualize_hybrid_bbox: true      # 하이브리드 bbox 표시

# 디버깅 스크립트 실행 제어 (수동 실행 스크립트용)
debug_tools:
  enabled: true
  hand_near_ratio_visualization: true
  hand_refiner_debug: true
  hand_clipping_debug: true

# =============================================================================
# [11] 정렬 설정
# =============================================================================
alignment:
  full_body_min_valid_lower: 4
  yolo_verification_enabled: true
  yolo_person_conf: 0.5
  yolo_face_conf: 0.3
  face_scale_enabled: true

# =============================================================================
# [12] Bbox 여백
# =============================================================================
bbox:
  person_margin: 0.0  # YOLO bbox가 충분히 정확하므로 margin 불필요
  face_margin: 0.1     # 10% 여백 추가

# =============================================================================
# [13] 얼굴 렌더링 (부위별 제어)
# =============================================================================
# 얼굴 전이 및 렌더링 설정
#
# v21 변경사항:
#   - use_3d_depth: Depth map 기반 Z축 보정 (선택적)
#   - jawline_correction: Jawline 미세 보정 (⭐ 새로 추가)
#
# use_3d_depth (3D Depth 보정):
#   - false (기본값): 순수 2D 좌표계 사용
#     → 안정적이고 예측 가능한 결과
#   - true: Depth Anything V2의 depth 정보 활용
#     → 극단적인 각도나 원근에서 개선 가능
#     → 실험적 기능, 경우에 따라 부자연스러울 수 있음
#
# jawline_correction (Jawline 미세 보정):
#   - false (권장): face_scale만 적용
#     → face_scale이 이미 얼굴/몸통 비율을 정확히 반영하므로 충분함
#     → 안정적이고 예측 가능한 결과
#   - true: face_scale 적용 후 Jawline 비율을 추가로 재조정
#     → Source와 Reference의 얼굴 형태가 크게 다를 때만 유용
#     → 대부분의 경우 얼굴을 오히려 작게 만드는 부작용 발생
#   ⚠️ 주의: true로 설정 시 얼굴이 0.5~0.7배로 축소될 수 있음
#
# depth_z_scale (3D 보정 강도):
#   - use_3d_depth=true일 때만 의미 있음
#   - 0.3~0.7 권장 (기본: 0.5)
#   - 값이 클수록 depth 효과가 강해짐
# =============================================================================
face_rendering:
  enabled: true                    # 얼굴 렌더링 활성화
  
  # ===== 3D Depth 기능 (선택적) =====
  use_3d_depth: false              # Depth map 기반 보정
                                   # false 권장: 2D 좌표계만 사용 (안정적)
                                   # true: 3D depth 정보 활용 (실험적)
  
  depth_z_scale: 0.5               # 3D 보정 강도 (use_3d_depth=true일 때만)
                                   # 0.3~0.7 권장 (기본: 0.5)
  
  # ===== Jawline 보정 (선택적) ⭐ v21 NEW =====
  jawline_correction: false        # Jawline 미세 보정
                                   # false 권장: face_scale만 적용 (안정적)
                                   #   → 얼굴/몸통 비율이 정확히 반영됨
                                   # true: 추가 비율 조정 (특수 케이스만)
                                   #   → Source와 Ref 얼굴 형태가 매우 다를 때
                                   # ⚠️ 주의: true 시 얼굴이 작아질 수 있음
                                   #   → 내부적으로 0.5~0.7 scale이 추가 적용됨
  
  # ===== 부위별 렌더링 제어 =====
  parts:
    jawline:
      enabled: true
      color: [255, 255, 255]
    left_eyebrow:
      enabled: true
      color: [255, 255, 255]
    right_eyebrow:
      enabled: true
      color: [255, 255, 255]
    nose:
      enabled: true
      color: [255, 255, 255]
    left_eye:
      enabled: true
      color: [255, 255, 255]
    right_eye:
      enabled: true
      color: [255, 255, 255]
    mouth_outer:
      enabled: true
      color: [255, 255, 255]
    mouth_inner:
      enabled: false
      color: [255, 255, 255]

# 단계별 콘솔 로그 출력 제어 (pipeline.py)
  show_module_init: false         # 모듈 초기화 로그
  show_step1: false              # [STEP 1] 포즈 추출 로그
  show_step2: false              # [STEP 2] 정렬 방식 결정 로그
  show_step3: false              # [STEP 3] Bbox 계산 로그
  show_step4: true               # [STEP 4] transfer 단계 로그 (항상 true 권장)

# DWPoseExtractor 전체 디버그 로그 제어
show_dwpose_debug: false